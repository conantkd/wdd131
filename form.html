<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Share your experience with a product by submitting a product review."
    />
    <meta name="author" content="Luis Miguel Chaves" />
    <title>Product Review Form | WDD 131</title>
    <link rel="stylesheet" href="styles/form.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script src="scripts/form.js" defer></script>
    <script src="scripts/getdates.js" defer></script>
  </head>
  <body>
    <header>
      <a class="brand" href="form.html" aria-label="Product review form home">
        <span>Product Reviews</span>
      </a>
    </header>

    <main>
      <section class="form-card" aria-labelledby="page-title">
        <div class="intro">
          <h1 id="page-title">Share your experience</h1>
          <p>Help others choose the right product by telling us what you think.</p>
        </div>

        <form action="review.html" method="get">
          <div class="form-field">
            <label for="product-name">Product Name <span class="required-note">(required)</span></label>
            <select id="product-name" name="product" required>
              <option value="" selected disabled>Select a Product ...</option>
            </select>
          </div>

          <fieldset class="form-field">
            <legend>Overall Rating <span class="required-note">(required)</span></legend>
            <div class="rating-options">
              <label for="rating-1">
                <input id="rating-1" name="rating" type="radio" value="1" required />
                <span class="rating-stars" aria-hidden="true">☆</span>
                <span class="visually-hidden">1 star</span>
              </label>
              <label for="rating-2">
                <input id="rating-2" name="rating" type="radio" value="2" required />
                <span class="rating-stars" aria-hidden="true">☆☆</span>
                <span class="visually-hidden">2 stars</span>
              </label>
              <label for="rating-3">
                <input id="rating-3" name="rating" type="radio" value="3" required />
                <span class="rating-stars" aria-hidden="true">☆☆☆</span>
                <span class="visually-hidden">3 stars</span>
              </label>
              <label for="rating-4">
                <input id="rating-4" name="rating" type="radio" value="4" required />
                <span class="rating-stars" aria-hidden="true">☆☆☆☆</span>
                <span class="visually-hidden">4 stars</span>
              </label>
              <label for="rating-5">
                <input id="rating-5" name="rating" type="radio" value="5" required />
                <span class="rating-stars" aria-hidden="true">☆☆☆☆☆</span>
                <span class="visually-hidden">5 stars</span>
              </label>
            </div>
          </fieldset>

          <div class="form-field">
            <label for="installation-date">Date of Installation <span class="required-note">(required)</span></label>
            <input id="installation-date" name="installation-date" type="date" required />
          </div>

          <fieldset class="form-field">
            <legend>Useful Features <span class="optional-note">(check all that apply)</span></legend>
            <div class="checkbox-options">
              <label for="feature-durability">
                <input id="feature-durability" name="features" type="checkbox" value="durability" />
                Durability
              </label>
              <label for="feature-ease-of-use">
                <input id="feature-ease-of-use" name="features" type="checkbox" value="ease-of-use" />
                Ease of use
              </label>
              <label for="feature-performance">
                <input id="feature-performance" name="features" type="checkbox" value="performance" />
                Performance
              </label>
              <label for="feature-design">
                <input id="feature-design" name="features" type="checkbox" value="design" />
                Design
              </label>
            </div>
          </fieldset>

          <div class="form-field">
            <label for="written-review">Written Review <span class="optional-note">(optional)</span></label>
            <textarea id="written-review" name="written-review" rows="5"></textarea>
          </div>

          <div class="form-field">
            <label for="user-name">Your Name <span class="optional-note">(optional)</span></label>
            <input id="user-name" name="user-name" type="text" autocomplete="name" />
          </div>

          <input class="submit-button" type="submit" value="Submit Review" />
        </form>
      </section>
    </main>

    <footer>
      <p>© <span id="currentyear"></span> | Luis Chaves | Colombia</p>
      <p id="lastModified"></p>
    </footer>
  </body>
</html>
