    <text x="24" y="377" font-size="19" font-weight="700">Servicios</text>
    <path d="M24 391h342" stroke="#9aa0a6"/>
    <text x="28" y="423" font-size="14" font-weight="700">Terapia Física</text>
    <text x="28" y="444" font-size="12" fill="#5f6368">Atención personalizada basada en evidencia</text>
    <text x="350" y="435" font-size="18">›</text>
