<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 1120" role="img" aria-labelledby="title desc">
  <title id="title">Rema mobile homepage wireframe</title>
  <desc id="desc">A clean mobile layout for the Rema Fisioterapia homepage, using open sections and minimal borders.</desc>
  <rect width="390" height="1120" fill="#ffffff"/>
  <g font-family="Arial, sans-serif" fill="#191c1d">
    <rect x="0" y="0" width="390" height="72" fill="#ffffff"/>
    <rect x="22" y="18" width="112" height="38" fill="#e5e7eb"/>
    <text x="78" y="42" text-anchor="middle" font-size="12">REMA LOGO</text>
    <path d="M339 26h28M339 36h28M339 46h28" stroke="#454b50" stroke-width="2"/>
    <path d="M0 71h390" stroke="#d1d5db"/>

