    <text x="28" y="490" font-size="14" font-weight="700">Fisioterapia a domicilio</text>
    <text x="28" y="511" font-size="12" fill="#5f6368">Atención en Bello, Medellín y alrededores</text>
    <text x="350" y="502" font-size="18">›</text>
    <path d="M24 527h342" stroke="#d1d5db"/>
    <text x="28" y="557" font-size="14" font-weight="700">Terapia Vascular y Manual</text>
    <text x="28" y="578" font-size="12" fill="#5f6368">Tratamientos especializados para tu bienestar</text>
    <text x="350" y="568" font-size="18">›</text>
    <path d="M24 594h342" stroke="#d1d5db"/>

    <rect x="0" y="620" width="390" height="132" fill="#f3f4f5"/>
    <text x="24" y="655" font-size="19" font-weight="700">¿Por qué Rema?</text>
    <text x="24" y="682" font-size="13">Equipo contigo · Atención en casa · Meta clara</text>
    <text x="24" y="707" font-size="12" fill="#5f6368">Te acompañamos a recuperar movimiento y calidad de vida.</text>

    <text x="24" y="796" font-size="19" font-weight="700">Opiniones de pacientes</text>
    <text x="24" y="825" font-size="13" font-weight="700">★★★★★  Reseña de Google</text>
    <text x="24" y="850" font-size="12" fill="#5f6368">“Excelente atención y acompañamiento durante</text>
    <text x="24" y="869" font-size="12" fill="#5f6368">todo el proceso...”</text>
    <path d="M24 889h342" stroke="#d1d5db"/>

    <rect x="0" y="914" width="390" height="144" fill="#eef0f2"/>
    <text x="24" y="947" font-size="19" font-weight="700">Contáctanos</text>
    <text x="24" y="974" font-size="12">Teléfono y WhatsApp</text>
    <text x="24" y="995" font-size="12">Consultorio y zonas de cobertura</text>
    <text x="24" y="1016" font-size="12">Horarios de atención</text>
    <rect x="258" y="963" width="108" height="72" fill="#d9dde1"/>
