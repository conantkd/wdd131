<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="WDD 131 – Dynamic Web Fundamentals, Web Site of Luis Chaves My place"
    />
    <meta name="author" content="Luis Chaves" />
    <title>
      "WDD 131 – Dynamic Web Fundamentals – Luis Chaves - My Place Activity
    </title>
    <link rel="stylesheet" href="styles/place.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&family=Valley+Sans:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <script src="scripts/place.js" defer></script>
    <script src="scripts/getdates.js" defer></script>
  </head>
  <body>
    <header>
      <h1>Colombia</h1>
    </header>

    <main>
      <div class="container">
      <picture>
        <source srcset="images/hero-desktop.webp" media="(min-width: 740px)" />
        <img
          src="images/hero-mobile.webp"
          alt="Landscape in Colombia"
          width="1000"
          height="600"
        />
      </picture>

      <section class="data-section">
        <h2>Data</h2>
        <p><strong>Area:</strong> 1,141,748 sq km</p>
        <p><strong>Population:</strong> 52,600,000</p>
        <p><strong>Capital:</strong> Bogotá</p>
        <p><strong>Languages:</strong> Spanish</p>
        <p><strong>Currency:</strong> Colombian Peso</p>
        <p><strong>Time Zone:</strong> UTC-5</p>
        <p><strong>Calling Code:</strong> +57</p>
        <p><strong>Internet TLD:</strong> .co</p>
      </section>

      <section class="weather-section">
        <h2>Weather</h2>
        <div class="weather-icon">
          <img
            src="images/weather.svg"
            alt="Weather symbol"
            width="48"
            height="48"
          />
        </div>
        <p><strong>Temperature:</strong> <span class="temperature-cell">10 °C</span></p>
        <p><strong>Conditions:</strong> Partly Cloudy</p>
        <p><strong>Wind:</strong> <span class="wind-speed">5 km/h</span></p>
        <p><strong>Wind Chill:</strong><span class="wind-chill">N/A</span> </p>
      </section>
      </div>
    </main>
    <footer>
      <p>© <span id="currentyear"> </span> | Luis Chaves | Colombia</p>
      <p id="lastModified"></p>
    </footer>
  </body>
</html>
