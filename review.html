<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Confirmation for your product review submission."
    />
    <meta name="author" content="Luis Miguel Chaves" />
    <title>Review Submitted | WDD 131</title>
    <link rel="stylesheet" href="styles/form.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script src="scripts/form.js" defer></script>
    <script src="scripts/getdates.js" defer></script>
  </head>
  <body>
    <header>
      <a class="brand" href="form.html" aria-label="Return to product review form">
        <span>Product Reviews</span>
      </a>
    </header>

    <main>
      <section class="form-card confirmation-card" aria-labelledby="page-title">
        <p class="eyebrow">REVIEW RECEIVED</p>
        <h1 id="page-title">Thank you for your feedback!</h1>
        <p id="confirmation-message" aria-live="polite">
          Your product review has been submitted.
        </p>
        <p class="review-count">
          Reviews completed: <strong id="review-count">0</strong>
        </p>
        <a class="back-link" href="form.html">Submit another review</a>
      </section>
    </main>

    <footer>
      <p>© <span id="currentyear"></span> | Luis Chaves | Colombia</p>
      <p id="lastModified"></p>
    </footer>
  </body>
</html>
